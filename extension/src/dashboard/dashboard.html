<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PoE 라이브 대시보드</title>
    <link rel="stylesheet" href="dashboard.css" />
  </head>
  <body>
    <header class="hd">
      <span class="hd-title" data-i18n="liveDashboard">📡 라이브 대시보드</span>
      <span class="hd-sub"><span data-i18n="selectLabel">선택</span> <b id="selCount">0/5</b></span>
      <span class="hd-recv" id="recvInfo" hidden></span>
      <span class="hd-spacer"></span>
      <select id="lang-select" class="lang-select" aria-label="Language"></select>
      <button id="startBtn" class="btn btn-start" type="button" data-i18n="start">▶ 시작</button>
      <button id="stopBtn" class="btn btn-stop" type="button" hidden data-i18n="stop">⏸ 정지</button>
      <button id="clearBtn" class="btn" type="button" data-i18n="clearItems">매물 비우기</button>
    </header>

    <section id="selectBar" class="select-bar"></section>
    <section id="statusBar" class="status-bar" hidden></section>
    <main id="hits" class="hits"></main>
    <p class="foot" data-i18n="footNote">
      읽기전용 — 사이트 공식 라이브검색 결과를 한곳에 모아 볼 뿐, 자동 귓속말·구매는 하지 않습니다.
      시작하면 검색마다 숨김 탭에서 라이브가 돌아갑니다(탭바엔 안 보임, 동시 최대 5개). 정지하면
      라이브검색만 끄고 탭은 유지해 매물에서 은신처 이동을 계속 쓸 수 있습니다. 완전히 닫으려면 이
      대시보드 탭을 닫으세요.
    </p>

    <script src="../common/i18n.js"></script>
    <script src="../common/url.js"></script>
    <script src="../common/storage.js"></script>
    <script src="dashboard.js"></script>
  </body>
</html>
